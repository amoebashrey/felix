<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="Felix mascot — a pixel speech bubble character">
  <!-- Outer dark outline -->
  <rect x="3" y="3" width="26" height="20" fill="#181815"/>
  <!-- Inner fill -->
  <rect x="5" y="5" width="22" height="16" fill="#FBFAF7"/>
  <!-- Tail at bottom-left -->
  <rect x="6" y="21" width="4" height="3" fill="#181815"/>
  <rect x="7" y="22" width="2" height="2" fill="#FBFAF7"/>
  <!-- Two pixel eyes -->
  <rect x="11" y="10" width="2" height="2" fill="#181815"/>
  <rect x="19" y="10" width="2" height="2" fill="#181815"/>
  <!-- Three thinking dots — last one rust -->
  <rect x="11" y="16" width="2" height="2" fill="#181815"/>
  <rect x="15" y="16" width="2" height="2" fill="#181815"/>
  <rect x="19" y="16" width="2" height="2" fill="#D6692F"/>
</svg>
